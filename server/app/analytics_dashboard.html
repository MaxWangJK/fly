<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fly Analytics</title>
<style nonce="__NONCE__">
:root{color-scheme:light dark;--bg:#f6f7f5;--card:#fff;--ink:#23362e;--muted:#69766f;--line:#e1e7e2;--green:#477b60}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:36px 24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}h1{font-size:26px;margin:0}p{margin:5px 0;color:var(--muted)}button{background:var(--ink);color:var(--card);border:0;border-radius:10px;padding:11px 18px;cursor:pointer}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.chart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.label{font-size:13px;color:var(--muted)}.value{font-size:31px;font-weight:650;margin-top:8px}.detail{font-size:12px;color:var(--muted);min-height:18px}.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}h2{font-size:16px;margin:0 0 15px}svg{width:100%;height:auto;display:block}svg text{font:10px system-ui;fill:var(--muted)}svg rect{fill:var(--green)}footer{margin-top:24px;font-size:12px;color:var(--muted)}#status{min-height:24px;font-size:13px;margin-top:14px}.empty{padding:48px;text-align:center;color:var(--muted)}@media(max-width:640px){main{padding:24px 16px}.metrics{grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:15px}.value{font-size:26px}.charts{grid-template-columns:1fr}h1{font-size:22px}}@media(prefers-color-scheme:dark){:root{--bg:#15201b;--card:#1e2c25;--ink:#e5eee8;--muted:#a3b7a9;--line:#33493c;--green:#92b89e}}
</style></head><body><main>
<header><div><h1>Fly Analytics</h1><p>匿名安装量与每日活跃</p></div><button id="refresh">刷新</button></header>
<section class="metrics" id="metrics" aria-live="polite"></section>
<div id="status" role="status">正在读取统计…</div>
<section class="charts"><article class="chart"><h2>每日新增安装 · 近30天</h2><div id="installs"></div></article><article class="chart"><h2>每日活跃设备 · 近30天</h2><div id="active"></div></article></section>
<footer>按上海时间统计。WAU/MAU包含今天，分别按7/30天内的设备去重。D1/D7/D30只计算安装后第1/7/30天的精确回访，以已到观察日的安装批次加权计算；“—”表示尚无可计算批次。设备编号随机生成，统计不关联账号，不收集业务内容。</footer>
</main><script nonce="__NONCE__">
'use strict';
const ns='http://www.w3.org/2000/svg';
function element(tag,text,className){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e;}
function svgElement(tag,attrs){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));return e;}
function plot(target,rows,key){const host=document.getElementById(target);host.replaceChildren();const max=Math.max(1,...rows.map(r=>r[key]));const svg=svgElement('svg',{viewBox:'0 0 500 205',role:'img','aria-label':target==='installs'?'近30日新增安装柱状图':'近30日活跃设备柱状图'});rows.forEach((row,i)=>{const h=row[key]/max*150;const bar=svgElement('rect',{x:35+i*15,y:170-h,width:10,height:Math.max(h,1),rx:2});const title=svgElement('title',{});title.textContent=row.date+'：'+row[key];bar.append(title);svg.append(bar);if(i===0||i===14||i===29){const label=svgElement('text',{x:35+i*15,y:193,'text-anchor':'middle'});label.textContent=row.date.slice(5);svg.append(label);}});for(const [y,value] of [[20,max],[172,0]]){const t=svgElement('text',{x:2,y});t.textContent=String(value);svg.append(t);}host.append(svg);}
let busy=false;
async function refresh(){if(busy)return;busy=true;document.getElementById('refresh').disabled=true;try{const response=await fetch('/api/admin/stats/overview',{credentials:'same-origin',cache:'no-store'});if(!response.ok)throw new Error();const data=await response.json();const cards=[['累计安装',data.total_installs],['今日新增',data.today_installs],['今日活跃',data.today_active],['昨日活跃',data.yesterday_active],['WAU · 7日唯一设备',data.last_7_days_active_unique],['MAU · 30日唯一设备',data.last_30_days_active_unique]];const metrics=document.getElementById('metrics');metrics.replaceChildren();for(const [name,value] of cards){const card=element('article',undefined,'card');card.append(element('div',name,'label'),element('div',Number(value).toLocaleString(),'value'));metrics.append(card);}for(const key of ['d1','d7','d30']){const item=data.retention[key];const card=element('article',undefined,'card');card.append(element('div',key.toUpperCase()+' 精确日留存','label'),element('div',item.rate_percent===null?'—':item.rate_percent+'%','value'),element('div',item.retained+' / '+item.eligible_installs+' 个已到观察日的安装','detail'));metrics.append(card);}plot('installs',data.trends,'installs');plot('active',data.trends,'active');document.getElementById('status').textContent='统计日期 '+data.server_date+' · Asia/Shanghai';}catch{document.getElementById('status').textContent='读取失败，请检查管理员登录或服务状态后重试。';}finally{busy=false;document.getElementById('refresh').disabled=false;}}
document.getElementById('refresh').addEventListener('click',refresh);refresh();
</script></body></html>
