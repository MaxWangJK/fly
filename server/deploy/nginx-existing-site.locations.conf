# Include inside the EXISTING world-workshop.cn HTTPS server block.
# Retain the site's current root, PHP/static routes and TLS configuration.
# These two existing PHP endpoints must win over the sync API prefix.
location = /api/checkout {
    rewrite ^ /index.php last;
}
location = /api/activate {
    rewrite ^ /index.php last;
}
location = /api {
    return 308 /api/;
}
location = /api/ws {
    proxy_pass http://127.0.0.1:18766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_buffering off;
}
location ^~ /api/ {
    client_max_body_size 8m;
    # No trailing slash: retain /api/ when passing to FastAPI.
    proxy_pass http://127.0.0.1:18766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
}
