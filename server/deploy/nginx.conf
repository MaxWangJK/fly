limit_req_zone $binary_remote_addr zone=fly_auth:10m rate=10r/m;
server {
    listen 80;
    server_name world-workshop.cn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name world-workshop.cn;
    ssl_certificate /etc/letsencrypt/live/world-workshop.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/world-workshop.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8m;
    location ~ ^/api/auth/(register|login)$ {
        limit_req zone=fly_auth burst=10 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://api:8000;
    }
    location ^~ /api/stats/ {
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 1k;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }
    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 90s;
        proxy_pass http://api:8000;
    }
}
