# Website and Fly Sync share the existing TLS certificate.
# Replace the existing site's server blocks after reviewing paths and nginx -t.
server {
    listen 80;
    server_name world-workshop.cn *.world-workshop.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name world-workshop.cn *.world-workshop.cn;

    ssl_certificate /etc/nginx/ssl/world-workshop.cn/world-workshop.cn_ca.crt;
    ssl_certificate_key /etc/nginx/ssl/world-workshop.cn/world-workshop.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/fly/public;
    index index.php;

    # Existing website API routes, still handled by its PHP entry point.
    location = /api/checkout {
        rewrite ^ /index.php last;
    }
    location = /api/activate {
        rewrite ^ /index.php last;
    }
    location = /api {
        return 308 /api/;
    }

    location = /api/ws {
        proxy_pass http://127.0.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
    }

    location ^~ /api/stats/ {
        access_log off;
        error_log /dev/null crit;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:18766;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
    }

    location ^~ /api/ {
        client_max_body_size 8m;
        # Preserve /api/ by omitting a trailing slash in proxy_pass.
        proxy_pass http://127.0.0.1:18766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/fly/public/index.php;
        fastcgi_pass unix:/run/php/fly.sock;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }
    location ~ \.php$ {
        return 404;
    }
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }
}
